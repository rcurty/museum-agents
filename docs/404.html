<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>California Museums & Exhibitions Explorer</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />

  <body>
    <div style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; font-family: sans-serif; background-color: #f8f9fa;" id="root">
      <div style="text-align: center; padding: 20px;">
        <h2 style="color: #1A365D; margin-bottom: 10px;">🏛️ California Museum Guide</h2>
        <p style="color: #4A5568; font-size: 16px;">Loading WebAssembly R Engine & Leaflet packages...</p>
        <p style="color: #718096; font-size: 13px;">First load takes ~5–10 seconds to initialize in browser.</p>
      </div>
    </div>
